packages:
  - '.' # Or your existing workspace mapping array

allowBuilds:
  esbuild: false

minimumReleaseAge: 10080 # Delays installs of brand new versions by 7 days
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - next@16.3.3
trustPolicy:
  no-downgrade: true # Rejects dependency updates if trust signals weaken
